events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip / Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-protobuf;

    # Caching Zone
    proxy_cache_path /cache
        levels=1:2
        keys_zone=tiles_cache:50m
        inactive=30d
        max_size=20g
        use_temp_path=off;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=tile_rate_limit:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=20r/s;

    # Docker Internal DNS Resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Detect Public Protocol (HTTP vs HTTPS behind Reverse Proxy)
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;
        server_name localhost _;

        set $postserve_backend "http://postserve:8090";
        set $tileserver_backend "http://tileserver-gl:8080";

        # CORS Headers for map libraries (MapLibre, Mapbox, Leaflet, OpenLayers)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS, PURGE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,X-Requested-With' always;
        add_header 'X-Cache-Status' $upstream_cache_status always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Healthcheck
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"makina-maps","timestamp":"$time_iso8601"}';
        }

        # Integrated Web Viewer UI
        location = / {
            root /usr/share/nginx/html;
            index index.html;
            try_files /index.html =404;

            # Automatically replace http://localhost:8080 in UI docs/snippets
            sub_filter 'http://localhost:8080' '$forwarded_proto://$http_host';
            sub_filter_once off;
        }

        location /web/ {
            alias /usr/share/nginx/html/;
            expires 1d;
            add_header Cache-Control "public";

            sub_filter 'http://localhost:8080' '$forwarded_proto://$http_host';
            sub_filter_once off;
        }

        # 1. Dynamic Vector Tiles from Postserve (OpenMapTiles / PostGIS)
        # Matches /data/v3/{z}/{x}/{y}.pbf
        rewrite ^/data/v3/([0-9]+)/([0-9]+)/([0-9]+)\.pbf$ /tiles/$1/$2/$3.pbf last;

        location ~ ^/tiles/(?<tile_path>[0-9]+/[0-9]+/[0-9]+\.pbf)$ {
            proxy_pass $postserve_backend/tiles/$tile_path;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_buffering on;

            limit_req zone=tile_rate_limit burst=30 nodelay;

            # Caching
            proxy_cache tiles_cache;
            proxy_cache_key "v3/$tile_path";
            proxy_cache_valid 200 204 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # TileJSON for v3 vector data
        location = /data/v3.json {
            proxy_pass $postserve_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;

            proxy_cache tiles_cache;
            proxy_cache_key "v3/tilejson/$forwarded_proto/$http_host";
            proxy_cache_valid 200 1h;

            # Automatically rewrite tiles URL to current scheme and public domain
            sub_filter 'http://localhost:8080' '$forwarded_proto://$http_host';
            sub_filter_once off;
            sub_filter_types application/json;

            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # 2. Styles, Fonts, Sprites
        location ~ ^/styles/(?<style_id>[^/]+)/style\.json$ {
            alias /usr/share/nginx/styles/$style_id/style.json;
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*' always;
            expires 1h;

            # Automatically replace http://localhost:8080 with actual request host and scheme
            sub_filter 'http://localhost:8080' '$forwarded_proto://$http_host';
            sub_filter_once off;
            sub_filter_types application/json;
        }

        location ~ ^/styles/(?<style_id>[^/]+)/(?<asset_path>sprites/.*|sprite.*)$ {
            alias /usr/share/nginx/styles/$style_id/$asset_path;
            add_header 'Access-Control-Allow-Origin' '*' always;
            expires 7d;
        }

        location /fonts/ {
            alias /usr/share/nginx/fonts/;
            add_header 'Access-Control-Allow-Origin' '*' always;
            expires 30d;
        }

        # 3. Rendered Raster Tiles (Forwarded to TileServer-GL)
        location ~ ^/styles/(?<raster_path>.*/[0-9]+/[0-9]+/[0-9]+(@[23]x)?\.(png|jpeg|webp))$ {
            proxy_pass $tileserver_backend/styles/$raster_path;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_buffering on;

            proxy_cache tiles_cache;
            proxy_cache_key "$request_uri";
            proxy_cache_valid 200 204 7d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # TileServer-GL static previews and fallback
        location /tileserver/ {
            proxy_pass $tileserver_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        # Cache Purge Notification / Check Endpoint
        location ~ /cache/purge/(?<purge_key>.*) {
            default_type application/json;
            return 200 '{"status":"acknowledged","key":"$purge_key"}';
        }
    }

    # Internal Monitoring & Metrics
    server {
        listen 82;
        server_name localhost;

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow all;
        }
    }
}
