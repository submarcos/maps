# OpenMapTiles & PostGIS Optimized Configuration

# Connectivity
listen_addresses = '*'
max_connections = 100

# Memory settings (Adjust according to system RAM)
shared_buffers = 512MB
work_mem = 64MB
maintenance_work_mem = 256MB
effective_cache_size = 2GB

# Storage & SSD optimizations
random_page_cost = 1.1
effective_io_concurrency = 200

# Write Ahead Log (WAL)
max_wal_size = 5GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_buffers = 16MB

# CRITICAL for MVT Tile Performance:
# JIT compilation introduces a 50-200ms overhead per tile query.
# Disabling JIT yields a massive latency drop for dynamic vector tiles.
jit = off

# Parallelism
max_worker_processes = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
