services:
  postgres:
    image: ${POSTGIS_IMAGE:-openmaptiles/postgis}:${TOOLS_VERSION:-latest}
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openmaptiles}
      POSTGRES_USER: ${POSTGRES_USER:-openmaptiles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openmaptiles}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openmaptiles} -d ${POSTGRES_DB:-openmaptiles}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postserve:
    image: openmaptiles/openmaptiles-tools:${TOOLS_VERSION:-latest}
    restart: unless-stopped
    command: postserve /tileset/schema/openmaptiles.yaml --verbose --serve=${OMT_HOST:-http://localhost:8080} --port=8090
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-openmaptiles}
      PGUSER: ${POSTGRES_USER:-openmaptiles}
      PGPASSWORD: ${POSTGRES_PASSWORD:-openmaptiles}
      OMT_HOST: ${OMT_HOST:-http://localhost:8080}
    volumes:
      - .:/tileset
      - ./data:/import
      - imposm_cache:/cache
    ports:
      - "8090:8090"

  import-data:
    image: openmaptiles/import-data:${TOOLS_VERSION:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openmaptiles}
      POSTGRES_USER: ${POSTGRES_USER:-openmaptiles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openmaptiles}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

  tileserver-gl:
    image: maptiler/tileserver-gl:latest
    restart: unless-stopped
    entrypoint: ["sh", "-c", "node /data/config/tileserver/prepare.js && exec /usr/src/app/docker-entrypoint.sh --config /tmp/config.json --port 8080 --bind 0.0.0.0 --ignore-missing-files --verbose"]
    volumes:
      - .:/data
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - postserve
      - tileserver-gl
    ports:
      - "${PORT:-8080}:80"
      - "${NGINX_STATUS_PORT:-8082}:82"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - ./styles:/usr/share/nginx/styles:ro
      - ./fonts:/usr/share/nginx/fonts:ro
      - nginx_cache:/cache
      - ./data/expire_tiles:/data/expire_tiles
    environment:
      - CACHE_KEYS_ZONE_SIZE=${CACHE_KEYS_ZONE_SIZE:-50m}
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:-20g}

volumes:
  pgdata:
  imposm_cache:
  nginx_cache:
